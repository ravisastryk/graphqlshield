name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.26 matches go.mod; tip catches regressions ahead of release.
        go: ['1.26', 'stable']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test (race + coverage)
        run: go test ./... -race -count=1 -coverprofile=coverage.out

      - name: Build examples
        run: |
          set -euo pipefail
          go build ./...
          (cd examples/audit-demo  && go mod tidy && go build ./...)
          (cd examples/gqlgen-demo && go mod tidy && go build ./...)

      - name: Upload coverage
        if: matrix.go == '1.26'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9
        with:
          # v2.11.2 is built with Go 1.26 — older v2.x (e.g. v2.5.0 on Go 1.25,
          # v1.64.x on Go 1.24) fail with `language version used to build
          # golangci-lint is lower than the targeted Go version`.
          version: v2.11.2
          args: --timeout=5m

      - name: Check gofmt
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Code is not formatted. Run 'gofmt -w .'"
            gofmt -d .
            exit 1
          fi

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  attack-suite:
    name: Live attack suite (gqlgen-demo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Start demo server
        working-directory: examples/gqlgen-demo
        run: |
          go mod tidy
          nohup go run server.go > /tmp/shield_server.log 2>&1 &
          for i in {1..30}; do
            curl -sf http://localhost:8080/health && break
            sleep 1
          done
      - name: Fire 8 CWE attack vectors
        run: bash examples/gqlgen-demo/attacks.sh
      - name: Server log on failure
        if: failure()
        run: cat /tmp/shield_server.log || true
